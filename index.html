<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>１対１スマイルスタディ 出退勤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root{
    --bg:#12203a;
    --paper:#f5f1e8;
    --gold:#f2b705;
    --teal:#4fb6a8;
    --red:#e4572e;
    --orange:#e8862e;
    --muted:#8fa0c2;
    --panel:#1b2c4d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:var(--bg);
    color:var(--paper);
    font-family:'Noto Sans JP',sans-serif;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #app{ position:relative; height:100vh; display:flex; flex-direction:column; }
  header{
    padding:24px 32px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    position:relative; z-index:2;
  }
  .header-controls{
    display:flex; align-items:center; gap:16px;
    margin-right:auto; /* ブランド名のすぐ右に寄せ、時計は右端のまま */
    padding-left:8px;
  }
  header .brand{ font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:22px; letter-spacing:.02em; }
  header .brand span{ display:block; font-size:14px; font-weight:500; color:var(--muted); margin-top:4px; }
  header .clock{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:16px; }
  main{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; }
  video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.7); }
  #frame{ position:relative; width:min(60vmin,420px); height:min(60vmin,420px); z-index:2; }
  .corner{ position:absolute; width:44px; height:44px; border:4px solid var(--gold); opacity:.9; }
  .corner.tl{top:0;left:0;border-right:none;border-bottom:none;border-radius:12px 0 0 0;}
  .corner.tr{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 12px 0 0;}
  .corner.bl{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 12px;}
  .corner.br{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 12px 0;}
  #frame.pulse .corner{ animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
  footer{ padding:28px 24px 40px; text-align:center; position:relative; z-index:2; }
  #status{ font-size:20px; color:var(--muted); }
  #debug{ font-size:12px; color:#5b6c8f; margin-top:6px; min-height:16px; }
  #cam-switch{
    background:transparent; border:1px solid #2c3f63; color:var(--paper);
    border-radius:10px; padding:9px 18px; font-size:14px; cursor:pointer;
    font-family:'Noto Sans JP',sans-serif; white-space:nowrap;
  }
  #settings-link{ font-size:13px; color:#5b6c8f; cursor:pointer; white-space:nowrap; padding:8px 4px; }
  #camera-error{ display:none; position:absolute; inset:0; background:var(--bg); z-index:5; align-items:center; justify-content:center; text-align:center; padding:40px; font-size:18px; color:var(--muted); }
  /* ===== オーバーレイ（設定・選択・入力・結果画面） ===== */
  #overlay{
    position:absolute; inset:0; z-index:10;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(10,16,32,.78);
    backdrop-filter:blur(2px);
  }
  #overlay.show{ display:flex; }
  .card{
    width:min(90vw,520px);
    max-height:88vh; overflow-y:auto;
    background:var(--panel);
    border-radius:24px;
    padding:36px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  /* 退勤フォーム用ワイドカード（スクロールなしで収めるための2カラム） */
  .card.wide{ width:min(96vw,900px); padding:24px 28px; }
  .card.wide .ov-teacher{ font-size:22px; margin-bottom:8px; }
  .card.wide .ov-label{ margin:10px 0 5px; }
  .card.wide .slot-btn{ padding:10px 6px; font-size:15px; }
  .card.wide .tag-btn{ padding:10px 4px; font-size:14px; }
  .card.wide .tapfield.small{ padding:10px 12px; font-size:18px; }
  .card.wide .ov-check{ margin-top:14px; }
  .card.wide .ov-actions{ margin-top:14px; }
  .card.wide .ov-error{ margin-top:6px; min-height:18px; }
  .co-cols{ display:flex; gap:24px; align-items:flex-start; }
  .co-col{ flex:1; min-width:0; }
  @media (max-width:720px){ .co-cols{ flex-direction:column; gap:0; } }
  .ov-teacher{ font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:28px; text-align:center; margin-bottom:18px; }
  .ov-body{ font-size:17px; color:var(--paper); line-height:1.7; }
  .ov-label{ display:block; font-size:14px; color:var(--muted); margin:18px 0 6px; }
  .ov-input{
    width:100%; padding:16px; font-size:22px; border-radius:12px; border:none;
    background:#0f1a30; color:var(--paper); font-variant-numeric:tabular-nums;
  }
  .ov-input:focus{ outline:2px solid var(--gold); }
  select.ov-input{ font-size:18px; }
  /* タップでホイールを開く表示フィールド（時間・数値 共通） */
  .tapfield{
    width:100%; padding:16px; font-size:26px; border-radius:12px; border:none;
    background:#0f1a30; color:var(--paper); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .tapfield .tf-ico{ font-size:15px; color:var(--muted); }
  .tapfield.small{ padding:12px 14px; font-size:20px; }
  /* 実施コマ（時間帯）・事務作業内容の選択ボタン */
  .slot-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
  .slot-btn{
    padding:13px 8px; border-radius:10px; border:1px solid #2c3f63;
    background:#0f1a30; color:var(--muted); font-size:16px; cursor:pointer;
    font-family:'Noto Sans JP',sans-serif; font-variant-numeric:tabular-nums; text-align:center;
  }
  .slot-btn.on{ background:var(--gold); border-color:var(--gold); color:#1c1400; font-weight:700; }
  /* 選択不可のコマ（代講になったコマ・退勤時刻より後に終わるコマ） */
  .slot-btn:disabled, .slot-btn.disabled{
    opacity:.32; cursor:not-allowed; text-decoration:line-through;
  }
  .slot-btn .slot-sub{ display:block; font-size:11px; text-decoration:none; color:var(--orange); }
  .tag-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:4px; }
  .tag-btn{
    padding:12px 6px; border-radius:10px; border:1px solid #2c3f63;
    background:#0f1a30; color:var(--muted); font-size:15px; cursor:pointer;
    font-family:'Noto Sans JP',sans-serif; text-align:center;
  }
  .tag-btn.on{ background:var(--teal); border-color:var(--teal); color:#04211d; font-weight:700; }
  /* 事務時間が未入力のあいだは事務作業内容を選択不可にする */
  .tag-btn:disabled{ opacity:.32; cursor:not-allowed; }
  /* 事務時間の行（開始〜終了＋クリア） */
  .jimu-row{ display:flex; align-items:center; gap:8px; }
  .jimu-row .tilde{ color:var(--muted); font-size:18px; flex:0 0 auto; }
  .mini-clear{
    flex:0 0 auto; background:transparent; border:1px solid #2c3f63; color:var(--muted);
    border-radius:8px; padding:10px 12px; font-size:13px; cursor:pointer;
    font-family:'Noto Sans JP',sans-serif;
  }
  .ov-check{ display:flex; align-items:center; gap:10px; margin-top:20px; font-size:16px; }
  .ov-check input{ width:22px; height:22px; }
  .ov-actions{ display:flex; gap:12px; margin-top:26px; }
  .ov-actions.stack{ flex-direction:column; }
  .btn{
    flex:1; padding:18px; border:none; border-radius:14px; font-size:18px; font-weight:700;
    font-family:'Zen Maru Gothic',sans-serif; cursor:pointer;
  }
  .btn-gold{ background:var(--gold); color:#1c1400; }
  .btn-teal{ background:var(--teal); color:#04211d; }
  .btn-orange{ background:var(--orange); color:#2a1600; }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid #2c3f63; flex:0 0 auto; padding:18px 22px; }
  .btn-primary{ background:var(--gold); color:#1c1400; width:100%; }
  .ov-error{ color:var(--red); font-size:15px; margin-top:10px; min-height:20px; }
  .ov-note{ background:#0f1a30; border-radius:12px; padding:14px 16px; font-size:15px; color:var(--paper); margin-top:16px; line-height:1.7; }
  .ov-note.warn{ border-left:4px solid var(--orange); }
  .ov-result{ text-align:center; }
  .ov-result .name{ font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:28px; }
  .ov-result .time{ color:var(--muted); font-size:16px; margin-top:8px; }
  .ov-result .msg{ font-size:16px; margin-top:16px; line-height:1.8; color:var(--paper); }
  .ov-result .msg.left{ text-align:left; }
  .ov-result.ok .name{ color:var(--gold); }
  .ov-result.late .name{ color:var(--orange); }
  .ov-result.checkout .name{ color:var(--teal); }
  .ov-result.review .name{ color:var(--orange); }
  .ov-result.error .name{ color:var(--red); }
  /* ===== スクロール式ホイールピッカー（時間・数値 共通） ===== */
  #wheel{
    position:fixed; inset:0; z-index:30; display:none;
    align-items:flex-end; justify-content:center;
    background:rgba(10,16,32,.6);
  }
  #wheel.show{ display:flex; }
  .wheel-sheet{
    width:min(94vw,440px); background:var(--panel);
    border-radius:24px 24px 0 0; padding:20px 22px 26px;
    box-shadow:0 -12px 40px rgba(0,0,0,.4);
  }
  .wheel-title{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:12px; }
  .wheel-cols{ position:relative; display:flex; justify-content:center; align-items:center; gap:14px; height:208px; }
  .wheel-highlight{
    position:absolute; left:0; right:0; top:calc(50% - 26px); height:52px;
    border-top:1px solid #3a4d75; border-bottom:1px solid #3a4d75;
    background:rgba(242,183,5,.06); border-radius:8px; pointer-events:none;
  }
  .wheel-col{
    height:208px; width:92px; overflow-y:scroll;
    scroll-snap-type:y mandatory; text-align:center;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .wheel-col::-webkit-scrollbar{ display:none; }
  .wheel-col .pad{ height:78px; }
  .wheel-item{
    height:52px; line-height:52px; font-size:30px; scroll-snap-align:center;
    color:#5f7099; font-variant-numeric:tabular-nums; transition:color .12s,transform .12s;
  }
  .wheel-item.sel{ color:var(--paper); font-weight:700; transform:scale(1.12); }
  .wheel-colon,.wheel-unit{ font-size:26px; color:var(--paper); }
  .wheel-unit{ font-size:20px; color:var(--muted); }
  .wheel-actions{ display:flex; gap:12px; margin-top:18px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">スマイルスタディ<span id="branch-label">出退勤</span></div>
    <div class="header-controls">
      <button id="cam-switch">&#128247; カメラ切替</button>
      <div id="settings-link">&#9881; 設定</div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>
  <main>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="frame" class="pulse">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
    </div>
    <div id="camera-error"><div id="camera-error-msg">カメラを起動できませんでした。<br>タブレットの設定でカメラの許可を確認してください。</div></div>
    <div id="overlay">
      <div class="card">
        <div class="ov-teacher" id="ov-teacher"></div>
        <div class="ov-body" id="ov-body"></div>
      </div>
    </div>
    <!-- スクロール式ホイールピッカー（時間・数値 共通） -->
    <div id="wheel">
      <div class="wheel-sheet">
        <div class="wheel-title" id="wheel-title">選択</div>
        <div class="wheel-cols" id="wheel-cols"></div>
        <div class="wheel-actions">
          <button class="btn btn-ghost" id="wheel-cancel" style="flex:1;">キャンセル</button>
          <button class="btn btn-primary" id="wheel-confirm">決定</button>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div id="status">QRコードを枠の中にかざしてください</div>
    <div id="debug"></div>
  </footer>
</div>
<script>
'use strict';
// =====================================================================
// 設定はこのファイルには書きません。
// Webhook URLと校舎名は、初回起動時の「初期設定」画面で入力してもらい、
// この端末のlocalStorageにだけ保存されます。
// =====================================================================
const STORAGE_KEY_WEBHOOK = 'smilestudy_webhook_url';
const STORAGE_KEY_BRANCH = 'smilestudy_branch_name';
const STORAGE_KEY_FACING = 'smilestudy_camera_facing'; // 'environment'（外カメ） or 'user'（内カメ）
let WEBHOOK_URL = '';
let BRANCH_NAME = '';
let CAMERA_FACING = localStorage.getItem(STORAGE_KEY_FACING) || 'environment';
// 遅刻の判定しきい値（分）。5分以内は代講なし。
const LATE_THRESHOLD_MIN = 5;
// =====================================================================
// 実施コマ（時間帯）
//   通常日・土日祝・講習期間で表示を分けず、常に全時間帯を表示。
//   key はGASへ送るコード。label は画面表示。
// =====================================================================
const LESSON_SLOTS = [
  { key: '0930-1050', label: '09:30 - 10:50' },
  { key: '1100-1220', label: '11:00 - 12:20' },
  { key: '1230-1350', label: '12:30 - 13:50' },
  { key: '1400-1520', label: '14:00 - 15:20' },
  { key: '1530-1650', label: '15:30 - 16:50' },
  { key: '1700-1820', label: '17:00 - 18:20' },
  { key: '1830-1950', label: '18:30 - 19:50' },
  { key: '2000-2120', label: '20:00 - 21:20' }
];
// コマkey（例 '0930-1050'）から終了時刻を「その日の分数」で返す（例 10:50 → 650）
function slotEndMin(key){
  const end = key.split('-')[1]; // 'HHMM'
  return Number(end.slice(0,2)) * 60 + Number(end.slice(2));
}
// 事務作業内容（固定3択・自由記述なし・「その他」なし）
const JIMU_TYPE_OPTIONS = ['定例面談', '研修', '管理者依頼事務'];
// 講師向けランダムメッセージ
const CHECKIN_MESSAGES = [
  '今日もよろしくお願いします！',
  '今日も生徒様の小さな前進を大切にしていきましょう！',
  '困ったことがあれば早めに共有してください！'
];
const CHECKOUT_MESSAGES = [
  '本日もありがとうございました！気をつけてお帰りください。',
  '今日も一日お疲れ様でした！',
  '退勤を記録しました。次回もよろしくお願いします！'
];
const LATE_ADMIN_MESSAGE =
  '遅刻内容を記録しました。\n業務に入る前に、運営管理者へ一度状況を説明し、対応内容の確認を受けてから業務に入ってください。';
const REVIEW_MESSAGE =
  '勤怠は提出できましたが、管理者確認が必要です。管理者確認が完了するまで給与計算への反映は保留されます。管理者に確認をお願いします。';
function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
// ----- DOM参照 -----
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');
const frameEl = document.getElementById('frame');
const cameraErrorEl = document.getElementById('camera-error');
const cameraErrorMsgEl = document.getElementById('camera-error-msg');
const overlayEl = document.getElementById('overlay');
const ovTeacherEl = document.getElementById('ov-teacher');
const ovBodyEl = document.getElementById('ov-body');
const camSwitchEl = document.getElementById('cam-switch');
// ----- 状態 -----
let scanning = false;
let cameraStarted = false;
let frameCount = 0;
let currentTeacher = null; // { id, name }
let scanTime = null;       // QRを読み取った瞬間のDate
let lateState = null;      // { lateMinutes, lateResponse, substituteId, substituteName, substituteSlots }
// ----- 時計 -----
function updateClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('ja-JP', {hour12:false});
}
setInterval(updateClock, 1000);
updateClock();
// =====================================================================
// スクロール式ホイールピッカー（汎用）
// =====================================================================
const ITEM_H = 52;
const wheelEl = document.getElementById('wheel');
const wheelTitleEl = document.getElementById('wheel-title');
const wheelColsEl = document.getElementById('wheel-cols');
const wheelConfirmEl = document.getElementById('wheel-confirm');
const wheelCancelEl = document.getElementById('wheel-cancel');
function pad2(n){ return String(n).padStart(2,'0'); }
function hm2min(hhmm){ const p = hhmm.split(':'); return Number(p[0])*60 + Number(p[1]); }
function markWheelSel(col){
  const items = col.querySelectorAll('.wheel-item');
  let idx = Math.round(col.scrollTop / ITEM_H);
  idx = Math.max(0, Math.min(items.length - 1, idx));
  items.forEach(function(el, i){ el.classList.toggle('sel', i === idx); });
}
function openWheel(title, cols, onConfirm){
  wheelTitleEl.textContent = title;
  let html = '<div class="wheel-highlight"></div>';
  cols.forEach(function(c, ci){
    html += '<div class="wheel-col"><div class="pad"></div>' +
            c.values.map(function(v){ return '<div class="wheel-item">' + v + '</div>'; }).join('') +
            '<div class="pad"></div></div>';
    if (c.unit){
      html += '<div class="wheel-unit">' + c.unit + '</div>';
    } else if (ci < cols.length - 1){
      html += '<div class="wheel-colon">' + (c.sep || ':') + '</div>';
    }
  });
  wheelColsEl.innerHTML = html;
  const colEls = wheelColsEl.querySelectorAll('.wheel-col');
  colEls.forEach(function(col){
    let t;
    col.addEventListener('scroll', function(){
      clearTimeout(t);
      t = setTimeout(function(){ markWheelSel(col); }, 50);
    });
  });
  wheelEl.classList.add('show');
  requestAnimationFrame(function(){
    colEls.forEach(function(col, ci){
      col.scrollTop = (cols[ci].initialIndex || 0) * ITEM_H;
      markWheelSel(col);
    });
  });
  wheelConfirmEl.onclick = function(){
    const idxs = Array.prototype.map.call(colEls, function(col){
      const n = col.querySelectorAll('.wheel-item').length;
      return Math.max(0, Math.min(n - 1, Math.round(col.scrollTop / ITEM_H)));
    });
    wheelEl.classList.remove('show');
    onConfirm(idxs);
  };
  wheelCancelEl.onclick = function(){ wheelEl.classList.remove('show'); };
}
// 時間ホイール（時・分）。min/max（HH:MM）を渡すと、
// 範囲外の「時」はそもそもホイールに表示されず、範囲外の組み合わせは範囲内に丸められる。
// （事務時間は出勤時間〜退勤時間の範囲だけ選択できる）
// minuteStep を指定すると分をその刻みで表示（事務時間は5分刻み）。
function openTimeWheel(initial, min, max, title, onConfirm, minuteStep){
  const step = minuteStep || 1;
  const minT = (min != null) ? hm2min(min) : 0;
  const maxT = (max != null) ? hm2min(max) : 23 * 60 + 59;
  const minH = Math.floor(minT / 60);
  const maxH = Math.floor(maxT / 60);
  const parts = (initial || '00:00').split(':');
  let h = Math.max(0, Math.min(23, parseInt(parts[0], 10) || 0));
  const m = Math.max(0, Math.min(59, parseInt(parts[1], 10) || 0));
  h = Math.max(minH, Math.min(maxH, h));
  const hours = []; for (let i = minH; i <= maxH; i++) hours.push(pad2(i));
  const mins = []; for (let i = 0; i < 60; i += step) mins.push(pad2(i));
  const mIdx = Math.max(0, Math.min(mins.length - 1, Math.round(m / step)));
  openWheel(title || '時間を選択',
    [{ values: hours, initialIndex: h - minH }, { values: mins, initialIndex: mIdx }],
    function(idxs){
      let total = (minH + idxs[0]) * 60 + Number(mins[idxs[1]]);
      if (total < minT) total = minT;
      if (total > maxT) total = maxT;
      onConfirm(pad2(Math.floor(total / 60)) + ':' + pad2(total % 60));
    });
}
// --- タップフィールド（必須の時間入力） ---
function timeFieldHtml(fieldId, value){
  return '<div class="tapfield" id="' + fieldId + '-field">' +
           '<span class="tf-val">' + value + '</span><span class="tf-ico">&#9660; スクロール</span>' +
         '</div>' +
         '<input type="hidden" id="' + fieldId + '" value="' + value + '">';
}
function attachTimeField(fieldId, min, max, title){
  const field = document.getElementById(fieldId + '-field');
  const hidden = document.getElementById(fieldId);
  field.onclick = function(){
    openTimeWheel(hidden.value, min, max, title, function(v){
      hidden.value = v;

// カメラ・QRスキャン
// =====================================================================
function facingLabel(){ return CAMERA_FACING === 'user' ? '内カメラ' : '外カメラ'; }
function updateCamSwitchLabel(){
  camSwitchEl.innerHTML = '📷 カメラ切替（現在：' + facingLabel() + '）';
}
async function startCamera(){
  if (typeof jsQR === 'undefined'){
    cameraErrorMsgEl.innerHTML = 'QR読み取りライブラリの読み込みに失敗しました。<br>インターネット接続を確認して、ページを再読み込みしてください。';
    cameraErrorEl.style.display = 'flex';
    debugEl.textContent = 'エラー：jsQRライブラリ未読み込み';
    return;
  }
  if (cameraStarted){
    scanning = true;
    return;
  }
  const primary = CAMERA_FACING === 'user' ? 'user' : 'environment';
  const attempts = [
    { video: { facingMode: { ideal: primary }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    { video: { facingMode: primary } },
    { video: { facingMode: { exact: primary } } },
    { video: true }
  ];
  let lastErr = null;
  for (const constraints of attempts){
    try{
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();
      cameraStarted = true;
      scanning = true;
      frameCount = 0;
      cameraErrorEl.style.display = 'none';
      debugEl.textContent = 'カメラ起動OK（' + facingLabel() + '）。QRを探しています…';
      requestAnimationFrame(tick);
      return;
    } catch(err){
      lastErr = err;
    }
  }
  cameraErrorEl.style.display = 'flex';
  debugEl.textContent = 'カメラ起動エラー：' + (lastErr ? (lastErr.name + ' ' + lastErr.message) : '不明');
}
async function switchCamera(){
  CAMERA_FACING = (CAMERA_FACING === 'environment') ? 'user' : 'environment';
  localStorage.setItem(STORAGE_KEY_FACING, CAMERA_FACING);
  updateCamSwitchLabel();
  if (video.srcObject){
    video.srcObject.getTracks().forEach(function(t){ t.stop(); });
    video.srcObject = null;
  }
  cameraStarted = false;
  scanning = false;
  debugEl.textContent = facingLabel() + 'に切り替えています…';
  await startCamera();
}
camSwitchEl.onclick = switchCamera;
updateCamSwitchLabel();
function tick(){
  if (video.readyState === video.HAVE_ENOUGH_DATA && scanning){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
    frameCount++;
    if (frameCount % 30 === 0){
      debugEl.textContent = 'スキャン中… (' + video.videoWidth + 'x' + video.videoHeight + ' / ' + frameCount + 'フレーム)';
    }
    if (code && code.data) handleScan(code.data);
  }
  requestAnimationFrame(tick);
}
function handleScan(data){
  scanning = false;
  frameEl.classList.remove('pulse');
  let parsed = null;
  try { parsed = JSON.parse(data); } catch(e) { parsed = null; }
  if (!parsed || !parsed.id || !parsed.name){
    showErrorScreen('QRコードの形式が正しくありません');
    return;
  }
  currentTeacher = parsed;
  scanTime = new Date();
  lateState = null;
  showChoose();
}

function attachNumberField(fieldId, min, max, step, unit, title){
  const field = document.getElementById(fieldId + '-field');
  const hidden = document.getElementById(fieldId);
  field.onclick = function(){
    openNumberWheel(Number(hidden.value), min, max, step, unit, title, function(val){
      hidden.value = String(val);
      field.querySelector('.tf-val').textContent = String(val);
    });
  };
}
function openNumberWheel(initial, min, max, step, unit, title, onConfirm){
  const values = [];
  for (let v = min; v <= max; v += step) values.push(String(v));
  let idx = Math.round((initial - min) / step);
  idx = Math.max(0, Math.min(values.length - 1, idx));
  openWheel(title, [{ values: values, initialIndex: idx, unit: unit }], function(idxs){
    onConfirm(min + idxs[0] * step);
  });
}

  const jimuRange = (jimuMin ? jimuMin : '') + '〜' + jimuMax;
  const nowMin = scanTime.getHours() * 60 + scanTime.getMinutes();
  const slotButtons = LESSON_SLOTS.map(function(s){
    const isSub = subSlots.indexOf(s.key) >= 0;
    const tooLate = slotEndMin(s.key) > nowMin; // 終了が退勤時刻より後のコマは選択不可
    if (isSub){
      return `<button type="button" class="slot-btn" data-slot="${s.key}" disabled>${s.label}<span class="slot-sub">代講対応</span></button>`;
    }
    if (tooLate){
      return `<button type="button" class="slot-btn" data-slot="${s.key}" disabled>${s.label}</button>`;
    }
    return `<button type="button" class="slot-btn" data-slot="${s.key}">${s.label}</button>`;
  }).join('');
  // 事務作業内容は、事務時間が入力されるまで選択不可（disabled）で表示する
  const typeButtons = JIMU_TYPE_OPTIONS.map(t =>
    `<button type="button" class="tag-btn" data-type="${escapeHtml(t)}" disabled>${escapeHtml(t)}</button>`
  ).join('');
  ovBodyEl.innerHTML = `
    <div style="text-align:center;color:var(--muted);font-size:14px;margin-bottom:2px;">
      退勤時間 ${fmtTime(scanTime)}｜業務開始・終了・休憩時間は自動計算されます
    </div>
    <div class="co-cols">
      <div class="co-col">
        <label class="ov-label">実施コマ（実施した授業時間帯をすべて選択）<br>
        <span style="font-size:12px;">※薄いコマは選択できません（代講対応のコマ／まだ終了していないコマ）</span></label>
        <div class="slot-grid" id="slot-grid">${slotButtons}</div>
      </div>
      <div class="co-col">
        <label class="ov-label">事務時間①（任意）</label>
        <div class="jimu-row">
          ${optTimeFieldHtml('in-jimu1-start')}
          <span class="tilde">〜</span>
          ${optTimeFieldHtml('in-jimu1-end')}
          <button type="button" class="mini-clear" id="btn-clear-jimu1">クリア</button>
        </div>
        <label class="ov-label">事務時間②（任意）</label>
        <div class="jimu-row">
          ${optTimeFieldHtml('in-jimu2-start')}
          <span class="tilde">〜</span>
          ${optTimeFieldHtml('in-jimu2-end')}
          <button type="button" class="mini-clear" id="btn-clear-jimu2">クリア</button>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px;">
          ※事務時間は5分単位・出勤〜退勤（${jimuRange}）の範囲で入力します。<br>
          ※1分単位の調整が必要な場合は、登録後に管理者へお伝えください。
        </div>
        <label class="ov-label">事務作業内容（事務時間を入力すると選択できます・入力した場合は必須）</label>
        <div class="tag-grid" id="jimu-type-grid">${typeButtons}</div>
      </div>
    </div>
    <div class="ov-error" id="err-checkout"></div>
    <div class="ov-actions">
      <button class="btn btn-ghost" id="btn-cancel">キャンセル</button>
      <button class="btn btn-primary" id="btn-submit">登録する</button>
    </div>
  `;
  // 事務時間の入力状況に応じて、事務作業内容ボタンの有効/無効を切り替える
  function jimuTimeEntered(){
    const j1s = document.getElementById('in-jimu1-start').value;
    const j1e = document.getElementById('in-jimu1-end').value;
    const j2s = document.getElementById('in-jimu2-start').value;
    const j2e = document.getElementById('in-jimu2-end').value;
    return !!((j1s && j1e) || (j2s && j2e));
  }
  function updateJimuTypeState(){
    const enabled = jimuTimeEntered();
    ovBodyEl.querySelectorAll('#jimu-type-grid .tag-btn').forEach(function(btn){
      btn.disabled = !enabled;
      if (!enabled) btn.classList.remove('on'); // 事務時間を消したら選択も解除
    });
  }
  attachOptTimeField('in-jimu1-start', '事務時間① 開始（' + jimuRange + '）', updateJimuTypeState, jimuMin, jimuMax);
  attachOptTimeField('in-jimu1-end', '事務時間① 終了（' + jimuRange + '）', updateJimuTypeState, jimuMin, jimuMax);
  attachOptTimeField('in-jimu2-start', '事務時間② 開始（' + jimuRange + '）', updateJimuTypeState, jimuMin, jimuMax);
  attachOptTimeField('in-jimu2-end', '事務時間② 終了（' + jimuRange + '）', updateJimuTypeState, jimuMin, jimuMax);
  document.getElementById('btn-clear-jimu1').onclick = function(){
    clearOptTimeField('in-jimu1-start');
    clearOptTimeField('in-jimu1-end');
    updateJimuTypeState();
  };
  document.getElementById('btn-clear-jimu2').onclick = function(){
    clearOptTimeField('in-jimu2-start');
    clearOptTimeField('in-jimu2-end');
    updateJimuTypeState();
  };
  ovBodyEl.querySelectorAll('#slot-grid .slot-btn').forEach(function(btn){
    if (btn.disabled) return;
    btn.onclick = function(){ btn.classList.toggle('on'); };
  });
  ovBodyEl.querySelectorAll('#jimu-type-grid .tag-btn').forEach(function(btn){
    btn.onclick = function(){ btn.classList.toggle('on'); };
  });
  document.getElementById('btn-cancel').onclick = resetToIdle;
  document.getElementById('btn-submit').onclick = () => {
    const errEl = document.getElementById('err-checkout');
    errEl.textContent = '';
    // 実施コマ（0コマも許可：事務のみ勤務の日があるため）
    // disabled（代講・未終了）のボタンは選択できないため、ここには入らない
    const slots = Array.prototype.map.call(
      ovBodyEl.querySelectorAll('#slot-grid .slot-btn.on:not(:disabled)'),
      function(b){ return b.getAttribute('data-slot'); }
    );
    // 事務時間①②：両方入力 or 両方未入力のみ許可。終了は開始より後。
    const j1s = document.getElementById('in-jimu1-start').value;
    const j1e = document.getElementById('in-jimu1-end').value;
    const j2s = document.getElementById('in-jimu2-start').value;
    const j2e = document.getElementById('in-jimu2-end').value;
    if ((j1s && !j1e) || (!j1s && j1e)){
      errEl.textContent = '事務時間①は開始・終了の両方を入力してください';
      return;
    }
    if ((j2s && !j2e) || (!j2s && j2e)){
      errEl.textContent = '事務時間②は開始・終了の両方を入力してください';
      return;
    }
    if (j1s && j1e && hm2min(j1e) <= hm2min(j1s)){
      errEl.textContent = '事務時間①の終了は開始より後にしてください';
      return;
    }
    if (j2s && j2e && hm2min(j2e) <= hm2min(j2s)){
      errEl.textContent = '事務時間②の終了は開始より後にしてください';
      return;
    }
    const jimuAny = (j1s && j1e) || (j2s && j2e);
    // 事務作業内容（複数選択・固定3択）
    const types = Array.prototype.map.call(
      ovBodyEl.querySelectorAll('#jimu-type-grid .tag-btn.on'),
      function(b){ return b.getAttribute('data-type'); }
    );
    if (jimuAny && types.length === 0){
      errEl.textContent = '事務時間を入力した場合は、事務作業内容を選択してください';
      return;
    }
    if (!jimuAny && types.length > 0){
      errEl.textContent = '事務作業内容を選択した場合は、事務時間を入力してください';
      return;
    }
    submitCheckout(slots, { j1s, j1e, j2s, j2e }, types);
  };
}
// =====================================================================
// 通信（JSONP）
// =====================================================================
function jsonpRequest(params){
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    const script = document.createElement('script');
    const timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error('タイムアウトしました'));
    }, 20000);
    function cleanup(){
      clearTimeout(timeoutId);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[callbackName] = (data) => {
      cleanup();
      resolve(data);
    };
    const query = new URLSearchParams(Object.assign({}, params, { callback: callbackName })).toString();
    script.src = WEBHOOK_URL + '?' + query;
    script.onerror = () => {
      cleanup();
      reject(new Error('Webhookへの接続に失敗しました。設定のURLを確認してください'));
    };
    document.body.appendChild(script);
  });
}
async function submitCheckin(){
  ovBodyEl.innerHTML = `<div style="text-align:center;color:var(--muted);">登録しています…</div>`;
  try{
    const json = await jsonpRequest({
      type: 'checkin',
      teacherId: currentTeacher.id,
      teacherName: currentTeacher.name,
      branch: BRANCH_NAME,
      scanTime: scanTime.toISOString()
    });
    showResult(json, 'checkin');
  } catch(err){
    showResult({ ok:false, message: err.message || '通信エラーです。もう一度お試しください。' });
  }
}
async function submitLate(){
  ovBodyEl.innerHTML = `<div style="text-align:center;color:var(--muted);">登録しています…</div>`;
  try{
    const params = {
      type: 'late',
      teacherId: currentTeacher.id,
      teacherName: currentTeacher.name,
      branch: BRANCH_NAME,
      scanTime: scanTime.toISOString(),
      lateMinutes: String(lateState.lateMinutes)
    };
    if (lateState.lateMinutes > LATE_THRESHOLD_MIN){
      params.lateResponse = lateState.lateResponse || '';
      if (lateState.lateResponse === '代講対応' && lateState.substituteId){
        params.substituteId = lateState.substituteId;
        params.substituteSlots = (lateState.substituteSlots || []).join(',');
      }
    }
    const json = await jsonpRequest(params);
    showResult(json, 'late');
  } catch(err){
    showResult({ ok:false, message: err.message || '通信エラーです。もう一度お試しください。' });
  }
}
async function submitCheckout(slots, jimu, types){
  ovBodyEl.innerHTML = `<div style="text-align:center;color:var(--muted);">登録しています…</div>`;
  const jimuEntered = !!((jimu.j1s && jimu.j1e) || (jimu.j2s && jimu.j2e));
  try{
    const json = await jsonpRequest({
      type: 'checkout',
      teacherId: currentTeacher.id,
      teacherName: currentTeacher.name,
      branch: BRANCH_NAME,
      scanTime: scanTime.toISOString(),
      lessonSlots: slots.join(','),
      jimu1Start: jimu.j1s || '',
      jimu1End: jimu.j1e || '',
      jimu2Start: jimu.j2s || '',
      jimu2End: jimu.j2e || '',
      jimuTypes: types.join(',')
    });
    showResult(json, 'checkout', { jimuEntered: jimuEntered });
  } catch(err){
    showResult({ ok:false, message: err.message || '通信エラーです。もう一度お試しください。' });
  }
}
// =====================================================================
// 画面: 結果表示
// =====================================================================
function showResult(json, kind, extra){
  setCardWide(false);
  ovTeacherEl.textContent = '';
  // 事務時間を入力した退勤のとき：5分単位で登録した旨の案内
  const jimuNote = (extra && extra.jimuEntered)
    ? '<div class="msg" style="font-size:13px;color:var(--muted);">※事務時間は5分単位で登録しました。1分単位の調整が必要な場合は管理者にお伝えください。</div>'
    : '';
  if (json && json.ok){
    if (kind === 'late'){
      ovBodyEl.innerHTML = `
        <div class="ov-result late">
          <div class="name">${escapeHtml(json.name)} 先生 遅刻を記録しました</div>
          <div class="time">${fmtTime(new Date(json.time))}</div>
          <div class="msg">${escapeHtml(LATE_ADMIN_MESSAGE).replace(/\n/g,'<br>')}</div>
        </div>
      `;
      setTimeout(resetToIdle, 6500);
      return;
    }
    if (kind === 'checkout'){
      const workInfo = (json.workStartTime && json.workEndTime)
        ? '｜業務 ' + toHHMM(new Date(json.workStartTime)) + '〜' + toHHMM(new Date(json.workEndTime))
        : '';
      const breakInfo = workInfo + ((typeof json.breakMinutes === 'number')
        ? '｜休憩 ' + json.breakMinutes + '分（自動計算）'
        : '');
      if (json.needsReview){
        // 管理者確認が必要（提出は受け付け済み・給与反映は保留）
        const reasons = (json.reviewReasons || [])
          .map(function(r){ return '・' + escapeHtml(r); }).join('<br>');
        ovBodyEl.innerHTML = `
          <div class="ov-result review">
            <div class="name">${escapeHtml(json.name)} 先生 退勤しました（管理者確認）</div>
            <div class="time">${fmtTime(new Date(json.time))}${breakInfo}</div>
            <div class="msg left">${reasons}<br><br>${escapeHtml(REVIEW_MESSAGE)}</div>
            ${jimuNote}
          </div>
        `;
        setTimeout(resetToIdle, 9000);
        return;
      }
      ovBodyEl.innerHTML = `
        <div class="ov-result checkout">
          <div class="name">${escapeHtml(json.name)} 先生 退勤しました</div>
          <div class="time">${fmtTime(new Date(json.time))}${breakInfo}</div>
          <div class="msg">${escapeHtml(pickRandom(CHECKOUT_MESSAGES))}</div>
          ${jimuNote}
        </div>
      `;
      setTimeout(resetToIdle, (extra && extra.jimuEntered) ? 6000 : 3600);
      return;
    }
    // 出勤
    ovBodyEl.innerHTML = `
      <div class="ov-result ok">
        <div class="name">${escapeHtml(json.name)} 先生 出勤しました</div>
        <div class="time">${fmtTime(new Date(json.time))}</div>
        <div class="msg">${escapeHtml(pickRandom(CHECKIN_MESSAGES))}</div>
      </div>
    `;
    setTimeout(resetToIdle, 3600);
  } else {
    ovBodyEl.innerHTML = `
      <div class="ov-result error">
        <div class="name">エラー</div>
        <div class="time">${escapeHtml((json && json.message) || '登録に失敗しました')}</div>
      </div>
    `;
    setTimeout(resetToIdle, 5000);
  }
}
function showErrorScreen(message){
  ovTeacherEl.textContent = '';
  ovBodyEl.innerHTML = `
    <div class="ov-result error">
      <div class="name">エラー</div>
      <div class="time">${escapeHtml(message)}</div>
    </div>
  `;
  openOverlay();
  setTimeout(resetToIdle, 2600);
}
// =====================================================================
// 共通
// =====================================================================
function openOverlay(){ overlayEl.classList.add('show'); }
function closeOverlay(){ overlayEl.classList.remove('show'); }
// 退勤フォームだけカードをワイド2カラムにする
function setCardWide(on){
  document.querySelector('#overlay .card').classList.toggle('wide', !!on);
}
function resetToIdle(){
  closeOverlay();
  setCardWide(false);
  wheelEl.classList.remove('show');
  currentTeacher = null;
  scanTime = null;
  lateState = null;
  statusEl.textContent = 'QRコードを枠の中にかざしてください';
  frameEl.classList.add('pulse');
  scanning = true;
}
function toHHMM(date){
  const h = String(date.getHours()).padStart(2,'0');
  const m = String(date.getMinutes()).padStart(2,'0');
  return h + ':' + m;
}
function combineTodayTime(hhmm){
  const parts = hhmm.split(':');
  const d = new Date();
  d.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
  return d;
}
function fmtTime(date){
  return date.toLocaleTimeString('ja-JP', {hour12:false});
}
function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// =====================================================================
// 起動処理
// =====================================================================
document.getElementById('settings-link').onclick = () => {
  showSetupForm();
};
const savedWebhook = localStorage.getItem(STORAGE_KEY_WEBHOOK);
const savedBranch = localStorage.getItem(STORAGE_KEY_BRANCH);
if (savedWebhook && savedBranch){
  applyConfig(savedWebhook, savedBranch);
  startCamera();
} else {
  showSetupForm();
}
